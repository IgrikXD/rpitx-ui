name: rpitx-ui 64-bit build

on:
  schedule:
    - cron: '0 0 1 * *'
  push:
    branches: [master]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'cmake/**'
      - '**/CMakeLists.txt'
      - '*.sh'
      - '.github/workflows/rpitx-ui-64-bit-build.yml'
  pull_request:
    branches: [ "**" ]
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'cmake/**'
      - '**/CMakeLists.txt'
      - '*.sh'
      - '.github/workflows/rpitx-ui-64-bit-build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build on latest Raspberry Pi OS 64-bit
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Build & verify on Raspberry Pi OS (arm64)
        uses: pguyot/arm-runner-action@v2
        with:
          base_image: raspios_lite_arm64:latest
          cpu: cortex-a72
          shell: /bin/bash
          image_additional_mb: 4096
          commands: |
            set -eu

            # ==============================================================
            # 0. System information & environment setup
            # ==============================================================
            echo "::group::System information"
            cat /etc/os-release
            echo "::endgroup::"

            # ==============================================================
            # 1. Verify the hardware compatibility check
            # ==============================================================
            echo "::group::Verify hardware compatibility check"
            # Sourcing install.sh only defines its constants and functions
            HW_CHECK_FIXTURE_DIR=$(mktemp -d)
            expect_hardware_check() {
              local expected_status=$1
              local status=0
              shift
              printf '%s\0' "$@" > "${HW_CHECK_FIXTURE_DIR}/compatible"
              ( set +x; source ./install.sh; DEVICE_TREE_DIR="${HW_CHECK_FIXTURE_DIR}"; check_hardware_compatibility ) || status=$?
              test "${status}" -eq "${expected_status}" || { echo "FAIL: hardware check returned ${status} instead of ${expected_status} for: $*"; exit 1; }
            }
            expect_hardware_check 0 raspberrypi,model-zero-w brcm,bcm2835
            expect_hardware_check 0 raspberrypi,2-model-b brcm,bcm2836
            expect_hardware_check 0 raspberrypi,3-model-b-plus brcm,bcm2837
            expect_hardware_check 0 raspberrypi,model-zero-2-w brcm,bcm2837
            expect_hardware_check 0 raspberrypi,4-model-b brcm,bcm2711
            expect_hardware_check 1 raspberrypi,5-model-b brcm,bcm2712
            expect_hardware_check 1 radxa,cm5-io radxa,cm5 rockchip,rk3588s
            echo "PASS: supported SoCs accepted, unsupported SoCs rejected"

            HW_CHECK_LOG=$(mktemp)
            HW_CHECK_STATUS=0
            bash ./install.sh > "${HW_CHECK_LOG}" 2>&1 < /dev/null || HW_CHECK_STATUS=$?
            cat "${HW_CHECK_LOG}"
            test "${HW_CHECK_STATUS}" -eq 1 || { echo "FAIL: install.sh exited with status ${HW_CHECK_STATUS} instead of 1"; exit 1; }
            grep -qF 'Unsupported hardware detected - installation aborted!' "${HW_CHECK_LOG}" || { echo "FAIL: unsupported hardware banner not printed"; exit 1; }
            if grep -qF 'Installing system dependencies' "${HW_CHECK_LOG}"; then
              echo "FAIL: install.sh started installing system dependencies before aborting"
              exit 1
            fi
            echo "PASS: installation aborted before any system change"
            echo "::endgroup::"

            # ==============================================================
            # 2. Verify the parallel build job count
            # ==============================================================
            echo "::group::Verify parallel build job count"
            MEMINFO_FIXTURE=$(mktemp)
            expect_build_jobs() {
              local expected_jobs=$1
              local fixture_cpu_cores=$2
              local fixture_available_mib=$3
              printf 'MemTotal: 3887800 kB\nMemAvailable: %d kB\nSwapFree: 2097148 kB\n' "$(( fixture_available_mib * 1024 ))" > "${MEMINFO_FIXTURE}"
              if ! (
                set +x
                source ./install.sh
                MEMINFO_FILE="${MEMINFO_FIXTURE}"
                nproc() { echo "${fixture_cpu_cores}"; }
                set_build_jobs
                test "${BUILD_JOBS}" -eq "${expected_jobs}"
              ); then
                echo "FAIL: expected ${expected_jobs} build jobs for ${fixture_cpu_cores} CPU cores and ${fixture_available_mib} MiB of available memory"
                exit 1
              fi
            }
            expect_build_jobs 1 4 340
            expect_build_jobs 1 4 1023
            expect_build_jobs 2 4 1024
            expect_build_jobs 4 4 3400
            expect_build_jobs 1 1 3400
            echo "PASS: parallel build jobs limited by CPU cores and available memory"
            echo "::endgroup::"

            # ==============================================================
            # 3. Verify the csdr installation check
            # ==============================================================
            echo "::group::Verify csdr installation check"
            CSDR_FIXTURE_DIR=$(mktemp -d)
            # Run a function of install.sh against the csdr fixture: csdr_fixture <commit> <board> <function>
            csdr_fixture() {
              local fixture_commit=$1
              local fixture_board=$2
              local installer_function=$3
              printf '%s\0' "${fixture_board}" > "${CSDR_FIXTURE_DIR}/model"
              (
                set +x
                source ./install.sh
                CSDR_COMMIT="${fixture_commit}"
                CSDR_FILES=("${CSDR_FIXTURE_DIR}/csdr" "${CSDR_FIXTURE_DIR}/nmux")
                CSDR_MANIFEST="${CSDR_FIXTURE_DIR}/csdr.sha256"
                DEVICE_TREE_DIR="${CSDR_FIXTURE_DIR}"
                "${installer_function}"
              )
            }
            expect_csdr_installed() {
              local expected_installed=$1
              local fixture_commit=$2
              local fixture_board=$3
              local installed=false
              if csdr_fixture "${fixture_commit}" "${fixture_board}" is_csdr_installed; then
                installed=true
              fi
              if [ "${installed}" != "${expected_installed}" ]; then
                echo "FAIL: csdr of commit ${fixture_commit} for ${fixture_board} reported as installed: ${installed} instead of ${expected_installed}"
                exit 1
              fi
            }
            printf 'csdr' > "${CSDR_FIXTURE_DIR}/csdr"
            printf 'nmux' > "${CSDR_FIXTURE_DIR}/nmux"
            expect_csdr_installed false 1111111 'Raspberry Pi 4 Model B Rev 1.2'
            csdr_fixture 1111111 'Raspberry Pi 4 Model B Rev 1.2' write_csdr_manifest
            expect_csdr_installed true 1111111 'Raspberry Pi 4 Model B Rev 1.2'
            expect_csdr_installed false 2222222 'Raspberry Pi 4 Model B Rev 1.2'
            expect_csdr_installed false 1111111 'Raspberry Pi Zero W Rev 1.1'
            printf 'modified' > "${CSDR_FIXTURE_DIR}/nmux"
            expect_csdr_installed false 1111111 'Raspberry Pi 4 Model B Rev 1.2'
            rm "${CSDR_FIXTURE_DIR}/nmux"
            expect_csdr_installed false 1111111 'Raspberry Pi 4 Model B Rev 1.2'
            echo "PASS: csdr reported as installed only with the unmodified files of the recorded commit and board"
            echo "::endgroup::"

            # ==============================================================
            # 4. Verify the boot configuration update
            # ==============================================================
            echo "::group::Verify boot configuration update"
            BOOT_CONFIG_FIXTURE="$(mktemp -d)/config.txt"
            BEGIN_MARKER='# BEGIN rpitx-ui related configuration'
            END_MARKER='# END rpitx-ui related configuration'
            RECOMMENDED_BLOCK="${BEGIN_MARKER}\ngpu_freq=250\nforce_turbo=1\n${END_MARKER}\n"
            expect_boot_config() {
              local expected_changed=$1
              local fixture_config=$2
              local expected_config=${3:-$2}
              printf '%b' "${fixture_config}" > "${BOOT_CONFIG_FIXTURE}"
              if ! (
                set +x
                source ./install.sh
                update_boot_config "${BOOT_CONFIG_FIXTURE}"
                test "${BOOT_CONFIG_CHANGED}" = "${expected_changed}" && cmp -s "${BOOT_CONFIG_FIXTURE}" <(printf '%b' "${expected_config}")
              ); then
                echo "FAIL: unexpected boot configuration update (expected a changed file: ${expected_changed}) of: ${fixture_config}"
                exit 1
              fi
            }
            expect_boot_config true 'enable_uart=1' "enable_uart=1\n${RECOMMENDED_BLOCK}"
            expect_boot_config false "${RECOMMENDED_BLOCK}enable_uart=1\n"
            expect_boot_config false "${RECOMMENDED_BLOCK//\\n/\\r\\n}"
            expect_boot_config true "${BEGIN_MARKER}\ngpu_freq=500\nforce_turbo=1\n${END_MARKER}\nenable_uart=1\n" "${RECOMMENDED_BLOCK}enable_uart=1\n"
            expect_boot_config true "${BEGIN_MARKER}\r\ngpu_freq=500\r\n${END_MARKER}\r\nenable_uart=1\r\n" "${RECOMMENDED_BLOCK}enable_uart=1\r\n"
            expect_boot_config true "${BEGIN_MARKER}\n\n${END_MARKER}\n" "${RECOMMENDED_BLOCK}"
            expect_boot_config true "${RECOMMENDED_BLOCK}enable_uart=1\n${RECOMMENDED_BLOCK}" "${RECOMMENDED_BLOCK}enable_uart=1\n"
            expect_boot_config true "${BEGIN_MARKER}\ngpu_freq=250\nenable_uart=1\n" "gpu_freq=250\nenable_uart=1\n${RECOMMENDED_BLOCK}"
            expect_boot_config true "${BEGIN_MARKER}\nenable_uart=1\n${RECOMMENDED_BLOCK}" "enable_uart=1\n${RECOMMENDED_BLOCK}"
            expect_boot_config true "gpu_freq=250\n${END_MARKER}\nenable_uart=1\n" "gpu_freq=250\nenable_uart=1\n${RECOMMENDED_BLOCK}"
            echo "PASS: rpitx-ui block added when missing, kept when up to date and restored when modified"
            echo "::endgroup::"

            # ==============================================================
            # 5. Install rpitx-ui with --enable-testing flag
            #    (--skip-hardware-check: no physical Raspberry Pi in CI)
            # ==============================================================
            echo "::group::Install rpitx-ui"
            sudo apt-get update && sudo apt-get install -y git
            echo "n" | bash ./install.sh --enable-testing --skip-hardware-check
            echo "::endgroup::"

            # ==============================================================
            # 6. Verify boot configuration was modified
            # ==============================================================
            echo "::group::Verify boot configuration"
            if [ -f /boot/firmware/config.txt ]; then
              BOOT_CONFIG=/boot/firmware/config.txt
            else
              BOOT_CONFIG=/boot/config.txt
            fi
            grep -qF '# BEGIN rpitx-ui related configuration' "$BOOT_CONFIG" || { echo "FAIL: rpitx-ui block not found in $BOOT_CONFIG"; exit 1; }
            grep -qF 'gpu_freq=250' "$BOOT_CONFIG"   || { echo "FAIL: gpu_freq=250 not found in $BOOT_CONFIG"; exit 1; }
            grep -qF 'force_turbo=1' "$BOOT_CONFIG"   || { echo "FAIL: force_turbo=1 not found in $BOOT_CONFIG"; exit 1; }
            grep -qF '# END rpitx-ui related configuration' "$BOOT_CONFIG"   || { echo "FAIL: rpitx-ui block end marker not found in $BOOT_CONFIG"; exit 1; }
            test -e /run/rpitx-ui-reboot-required || { echo "FAIL: reboot not requested after the boot configuration change"; exit 1; }
            echo "PASS: boot configuration verified"
            echo "::endgroup::"

            # ==============================================================
            # 7. Verify all installed binaries
            # ==============================================================
            echo "::group::Verify installed binaries"
            REQUIRED_BINARIES=(
              corel8 foxhunt freedv piam pichirp pidcf77 pifmrds
              pifsq pift8 pimorse pinfm piopera pirfgen pirtty pispectrumpaint
              pissb pisstv pitune pocsag sendiq sendook
            )
            OPTIONAL_BINARIES=(dvbrf rpitx)

            for bin in "${REQUIRED_BINARIES[@]}"; do
              test -x "/usr/bin/${bin}" || { echo "FAIL: required binary /usr/bin/${bin} missing"; exit 1; }
              echo "  OK: /usr/bin/${bin}"
            done

            for bin in "${OPTIONAL_BINARIES[@]}"; do
              if test -x "/usr/bin/${bin}"; then
                echo "  OK: /usr/bin/${bin} (optional)"
              else
                echo "  SKIP: /usr/bin/${bin} not built (optional)"
              fi
            done
            echo "PASS: all required binaries installed"
            echo "::endgroup::"

            # ==============================================================
            # 8. Verify the installed runtime dependencies
            # ==============================================================
            echo "::group::Verify installed runtime dependencies"
            sha256sum --check /var/lib/rpitx-ui/csdr.sha256 || { echo "FAIL: installed csdr does not match its manifest"; exit 1; }
            echo "PASS: runtime dependencies installed"
            echo "::endgroup::"

            # ==============================================================
            # 9. Verify all installed scripts
            # ==============================================================
            echo "::group::Verify installed scripts"
            INSTALLED_SCRIPTS=(
              rpitx-ui ft8menu.sh rtlmenu.sh
              fm2ssb.sh snap2spectrum.sh snapsstv.sh sv1afnfilter.sh
              testam.sh testchirp.sh testfmrds.sh testfoxhunt.sh
              testfreedv.sh testfsq.sh testmorse.sh testnfm.sh
              testopera.sh testpocsag.sh testrfgen.sh testrtty.sh testspectrum.sh
              testssb.sh testsstv.sh testtune.sh transponder.sh
            )

            for s in "${INSTALLED_SCRIPTS[@]}"; do
              test -x "/usr/bin/${s}" || { echo "FAIL: script /usr/bin/${s} missing"; exit 1; }
              echo "  OK: /usr/bin/${s}"
            done
            echo "PASS: all scripts installed"
            echo "::endgroup::"

            # ==============================================================
            # 10. Verify resource files
            # ==============================================================
            echo "::group::Verify installed resources"
            test -d /usr/share/rpitx-ui || { echo "FAIL: /usr/share/rpitx-ui directory missing"; exit 1; }

            mapfile -t EXPECTED_RESOURCES < <(find src/resources -type f -printf '%P\n' | sort)
            test "${#EXPECTED_RESOURCES[@]}" -gt 0 || { echo "FAIL: src/resources does not contain files"; exit 1; }

            for res in "${EXPECTED_RESOURCES[@]}"; do
              test -f "/usr/share/rpitx-ui/${res}" || { echo "FAIL: resource /usr/share/rpitx-ui/${res} missing"; exit 1; }
              echo "  OK: /usr/share/rpitx-ui/${res}"
            done
            echo "PASS: all resources installed"
            echo "::endgroup::"

            # ==============================================================
            # 11. Verify rpitx-ui is callable from any directory
            # ==============================================================
            echo "::group::Verify rpitx-ui callable from any directory"
            pushd /tmp > /dev/null
            command -v rpitx-ui > /dev/null || { echo "FAIL: rpitx-ui not found in PATH"; exit 1; }
            RPITX_PATH=$(command -v rpitx-ui)
            test -x "${RPITX_PATH}" || { echo "FAIL: rpitx-ui is not executable"; exit 1; }
            echo "  rpitx-ui resolved to: ${RPITX_PATH}"

            # Verify it's a shell script (not a broken symlink, etc.)
            file "${RPITX_PATH}" | grep -qi "script\|text" || { echo "FAIL: rpitx-ui is not a shell script"; exit 1; }
            popd > /dev/null
            echo "PASS: rpitx-ui is callable from any directory"
            echo "::endgroup::"

            # ==============================================================
            # 12. Verify the reinstallation of rpitx-ui before and after
            #     the reboot requested by the first installation
            # ==============================================================
            echo "::group::Verify rpitx-ui reinstallation"
            REINSTALL_LOG=$(mktemp)
            reinstall_rpitx_ui() {
              local status=0
              bash ./install.sh --enable-testing --skip-hardware-check > "${REINSTALL_LOG}" 2>&1 < /dev/null || status=$?
              cat "${REINSTALL_LOG}"
              test "${status}" -eq 0 || { echo "FAIL: reinstallation exited with status ${status} instead of 0"; exit 1; }
              grep -qF 'is already installed, skipping.' "${REINSTALL_LOG}" || { echo "FAIL: csdr rebuilt although it is already installed"; exit 1; }
              grep -qF 'is up to date, skipping.' "${REINSTALL_LOG}" || { echo "FAIL: rpitx-ui block rewritten although it is up to date"; exit 1; }
            }
            reinstall_rpitx_ui
            grep -qF 'A reboot is required' "${REINSTALL_LOG}" || { echo "FAIL: reboot not requested again before the system is rebooted"; exit 1; }
            # A reboot removes the pending reboot flag
            sudo rm -f /run/rpitx-ui-reboot-required
            reinstall_rpitx_ui
            if grep -qF 'A reboot is required' "${REINSTALL_LOG}"; then
              echo "FAIL: reboot requested although the boot configuration has not been changed"
              exit 1
            fi
            echo "PASS: reinstallation skipped the csdr build and requested a reboot only while it was pending"
            echo "::endgroup::"

            # ==============================================================
            # 13. Uninstall rpitx-ui (with --purge-deps to also remove
            #     runtime third-party dependencies and verify full cleanup)
            # ==============================================================
            echo "::group::Uninstall rpitx-ui"
            echo "n" | bash ./uninstall.sh --purge-deps
            echo "::endgroup::"

            # ==============================================================
            # 14. Verify all binaries removed
            # ==============================================================
            echo "::group::Verify binaries removed"
            ALL_BINARIES=(
              corel8 dvbrf foxhunt freedv piam pichirp pidcf77 pifmrds
              pifsq pift8 pimorse pinfm piopera pirfgen pirtty pispectrumpaint
              pissb pisstv pitune pocsag rpitx sendiq sendook
            )

            for bin in "${ALL_BINARIES[@]}"; do
              if test -f "/usr/bin/${bin}"; then
                echo "FAIL: /usr/bin/${bin} still exists after uninstall"
                exit 1
              fi
            done
            echo "PASS: all binaries removed"
            echo "::endgroup::"

            # ==============================================================
            # 15. Verify all scripts removed
            # ==============================================================
            echo "::group::Verify scripts removed"
            ALL_SCRIPTS=(
              rpitx-ui ft8menu.sh rtlmenu.sh
              fm2ssb.sh snap2spectrum.sh snapsstv.sh sv1afnfilter.sh
              testam.sh testchirp.sh testfmrds.sh testfoxhunt.sh
              testfreedv.sh testfsq.sh testmorse.sh testnfm.sh
              testopera.sh testpocsag.sh testrfgen.sh testrtty.sh testspectrum.sh
              testssb.sh testsstv.sh testtune.sh transponder.sh
            )

            for s in "${ALL_SCRIPTS[@]}"; do
              if test -f "/usr/bin/${s}"; then
                echo "FAIL: /usr/bin/${s} still exists after uninstall"
                exit 1
              fi
            done
            echo "PASS: all scripts removed"
            echo "::endgroup::"

            # ==============================================================
            # 16. Verify resources removed
            # ==============================================================
            echo "::group::Verify resources removed"
            if test -d /usr/share/rpitx-ui; then
              echo "FAIL: /usr/share/rpitx-ui still exists after uninstall"
              exit 1
            fi
            echo "PASS: resources directory removed"
            echo "::endgroup::"

            # ==============================================================
            # 17. Verify runtime dependencies removed
            # ==============================================================
            echo "::group::Verify runtime dependencies removed"
            for bin in csdr csdr-fm nmux; do
              test ! -f "/usr/bin/${bin}" || { echo "FAIL: /usr/bin/${bin} still exists"; exit 1; }
            done

            for lib in /usr/lib/libcsdr.so*; do
              test ! -f "${lib}" || { echo "FAIL: ${lib} still exists"; exit 1; }
            done

            test ! -e /var/lib/rpitx-ui || { echo "FAIL: /var/lib/rpitx-ui still exists"; exit 1; }
            echo "PASS: runtime dependencies removed"
            echo "::endgroup::"

            # ==============================================================
            # 18. Verify boot configuration reverted
            # ==============================================================
            echo "::group::Verify boot configuration reverted"
            if [ -f /boot/firmware/config.txt ]; then
              BOOT_CONFIG=/boot/firmware/config.txt
            else
              BOOT_CONFIG=/boot/config.txt
            fi
            if grep -qF '# BEGIN rpitx-ui related configuration' "$BOOT_CONFIG" 2>/dev/null; then
              echo "FAIL: rpitx-ui block still present in $BOOT_CONFIG"
              exit 1
            fi
            if grep -qF 'gpu_freq=250' "$BOOT_CONFIG" 2>/dev/null; then
              echo "FAIL: gpu_freq=250 still present in $BOOT_CONFIG"
              exit 1
            fi
            if grep -qF 'force_turbo=1' "$BOOT_CONFIG" 2>/dev/null; then
              echo "FAIL: force_turbo=1 still present in $BOOT_CONFIG"
              exit 1
            fi
            echo "PASS: boot configuration reverted"
            echo "::endgroup::"

            echo ""
            echo "========================================"
            echo " ALL TESTS PASSED"
            echo "========================================"
